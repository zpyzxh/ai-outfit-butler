name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve base path
        id: base
        run: |
          # 仓库名是 <user>.github.io 时部署在根路径，否则在 /<repo>/ 子路径
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare environment
        env:
          SB_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # 优先用仓库 Secrets；没配则回落到仓库里的演示配置（anon key 本身就是公开凭证）
          if [ -n "$SB_URL" ] && [ -n "$SB_KEY" ]; then
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SB_URL" "$SB_KEY" > .env
            echo "using repository secrets"
          else
            cp .env.demo .env
            echo "using .env.demo fallback"
          fi

      - name: Build web bundle
        env:
          EXPO_BASE_URL: ${{ steps.base.outputs.value }}
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform web

      # PWA / 手机端 head 标签：output 是 "single" 时 app/+html.tsx 不生效，
      # 所以用脚本后处理（只改 head，不动 JS）。必须在生成 404.html 之前跑。
      - name: Inject PWA head tags
        run: node scripts/patch-web-head.mjs dist

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      # 注意：这里不能加 enablement: true。
      # 实测（run #1）该参数会失败 —— 开启 Pages 属于仓库 admin 权限，
      # 而 GITHUB_TOKEN 没有 admin（它只有 pages: write 的部署权）。
      # 所以 Pages 的 Source 需要在 Settings → Pages 里手动选一次
      # "GitHub Actions"；之后这个 action 只负责解析 base_path，不再改配置。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
